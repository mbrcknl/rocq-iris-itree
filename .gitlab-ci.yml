image: ralfjung/opam-ci:opam2

stages:
  - build

variables:
  CPU_CORES: "4"
  OCAML: "ocaml-base-compiler.4.14.0"

.branches_and_mr: &branches_and_mr
  only:
    - master@ou-plf/iris-itree
    - /^ci/@ou-plf/iris-itree
    - merge_requests

.template: &template
  <<: *branches_and_mr
  stage: build
  script:
    - git clone https://gitlab.mpi-sws.org/iris/ci.git ci -b opam2
    - ci/buildjob
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - _opam/
  except:
    - triggers
    - schedules
    - api

## Build jobs

build-coq.8.18.0:
  <<: *template
  variables:
    OPAM_PINS: "coq version 8.18.0"

trigger-iris.dev:
  <<: *template
  variables:
    STDPP_REPO: "iris/stdpp"
    IRIS_REPO: "iris/iris"
    OPAM_PINS: "coq version 8.18.0   git+https://gitlab.mpi-sws.org/$STDPP_REPO#$STDPP_REV   git+https://gitlab.mpi-sws.org/$IRIS_REPO#$IRIS_REV"
  except:
  only:
    refs:
    - triggers
    - schedules
    - api
    variables:
    - $TIMING_AD_HOC_ID == null
